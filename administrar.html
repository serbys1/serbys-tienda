<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOW-COST | Panel de Administración</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; }
        .navbar { background-color: #003399; padding: 15px 0; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo-text { font-size: 22px; font-weight: bold; color: #fff; text-decoration: none; display: block; }
        .menu-admin { margin-top: 10px; }
        .menu-admin a { color: #fcd116; text-decoration: none; font-weight: bold; margin: 0 10px; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        h1 { border-bottom: 3px solid #003399; padding-bottom: 10px; color: #003399; }
        
        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        .producto { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .producto-img-container { width: 100%; height: 150px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; overflow: hidden; background: #eee; }
        .producto img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .botones-bloque { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        
        /* BOTÓN AZUL DE EDITAR CORRECTO */
        .btn-editar { background: #007bff; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 13px; text-decoration: none; display: block; box-sizing: border-box; }
        .btn-editar:hover { background: #0056b3; }
        
        .btn-eliminar { background: #cc0000; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .btn-eliminar:hover { background: #990000; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-text">⚙️ LOW-COST | PANEL DE CONTROL PRIVADO</div>
        <div class="menu-admin">
            <a href="crear-producto.html">➕ Publicar Producto</a> | 
            <a href="index.html" target="_blank">👁️ Ver Tienda Pública</a>
        </div>
    </header>

    <div class="container">
        <h1>Inventario de Productos (Modificar o Quitar)</h1>
        <div class="catalogo" id="lista-admin"></div>
    </div>

    <script>
        function cargarAdmin() {
            const contenedor = document.getElementById('lista-admin');
            const lista = JSON.parse(localStorage.getItem('mis_productos')) || [];
            
            if(lista.length === 0) {
                contenedor.innerHTML = "<p>No tienes ningún producto activo en la tienda.</p>";
                return;
            }
            
            contenedor.innerHTML = "";
            lista.forEach(prod => {
                const foto = prod.todasLasFotos && prod.todasLasFotos.length > 0 ? prod.todasLasFotos[0] : 'https://placehold.co';
                contenedor.innerHTML += `
                    <div class="producto">
                        <div class="producto-img-container"><img src="${foto}"></div>
                        <h3 style="font-size:16px; margin:5px 0;">${prod.titulo}</h3>
                        <p style="margin:5px 0;"><strong>Precio:</strong> $${prod.precio}</p>
                        <p style="color: gray; text-transform: uppercase; font-size: 11px; margin:0;">Categoría: ${prod.categoria}</p>
                        
                        <div class="botones-bloque">
                            <!-- Conecta directo con la nueva página de edición -->
                            <a href="editar-producto.html?id=${prod.id}" class="btn-editar">✏️ Editar Datos / Precio</a>
                            <button class="btn-eliminar" onclick="eliminar(${prod.id})">❌ Eliminar Vendido</button>
                        </div>
                    </div>
                `;
            });
        }

        function eliminar(id) {
            if(confirm("¿Seguro que quieres quitar este artículo de la tienda?")) {
                let lista = JSON.parse(localStorage.getItem('mis_productos')) || [];
                lista = lista.filter(p => p.id !== id);
                localStorage.setItem('mis_productos', JSON.stringify(lista));
                cargarAdmin();
            }
        }
        window.onload = cargarAdmin;
    </script>
</body>
</html>
