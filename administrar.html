<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOW-COST ® - Panel Integral</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TU BANNER AMARILLO BONITO -->
    <div style="background: #ffcc00; padding: 15px; text-align: center; font-weight: bold; font-family: sans-serif; font-size: 24px; color: #0044cc; border-bottom: 3px solid #0044cc; letter-spacing: 1px;">
        LOW-COST ® - PANEL INTEGRAL
    </div>

    <div class="container-admin" style="padding: 30px; max-width: 650px; margin: 30px auto; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); font-family: sans-serif;">
        <h2 style="text-align: center; color: #0044cc; margin-bottom: 25px; font-weight: bold;">Publicar Artículo</h2>
        
        <form id="form-producto" style="display: flex; flex-direction: column; gap: 20px;">
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 8px;">Categoría:</label>
                <select id="categoria" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; background: white; font-size: 15px;">
                    <option value="audio">Audio</option>
                    <option value="ropa">Ropa</option>
                    <option value="muebles">Muebles</option>
                    <option value="suministros">Suministros</option>
                    <option value="games">Games</option>
                    <option value="disco">Disco</option>
                </select>
            </div>

            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 8px;">Selecciona las fotos desde tu PC (Máximo 5):</label>
                <input type="file" id="foto-file" accept="image/*" multiple required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #fdfdfd;">
            </div>

            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 8px;">Título del Producto:</label>
                <input type="text" id="nombre" required placeholder="Ej: Parlante Sansui" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px;">
            </div>

            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 8px;">Precio ($):</label>
                <input type="number" step="0.01" id="precio" required placeholder="Ej: 120.00" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px;">
            </div>

            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 8px;">Descripción:</label>
                <textarea id="descripcion" required placeholder="Detalles del producto..." style="width: 100%; height: 100px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; font-size: 15px;"></textarea>
            </div>

            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 8px;">Especificaciones Técnicas:</label>
                <textarea id="especificaciones" placeholder="Marca: Sony&#10;Estado: Usado" style="width: 100%; height: 100px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; font-size: 15px;"></textarea>
            </div>

            <button type="submit" id="btn-guardar" style="background: #0044cc; color: white; padding: 15px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase;">
                Publicar Artículo
            </button>
        </form>
        
        <div id="mensaje-estado" style="margin-top: 20px; padding: 12px; text-align: center; font-weight: bold; font-size: 15px; border-radius: 4px;"></div>
    </div>

    <!-- MOTOR AUTOMÁTICO CORREGIDO PARA MULTIFOTOS -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCK3ydBkB_Y3fctSsGLizEQtlYBUaUo8U",
            authDomain: "://firebaseapp.com",
            projectId: "serbys-tienda",
            storageBucket: "serbys-tienda.firebasestorage.app",
            messagingSenderId: "987419818662",
            appId: "1:987419818662:web:2eb44b006d75fe9e5b5267"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('form-producto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-guardar');
            const estado = document.getElementById('mensaje-estado');
            const fileInput = document.getElementById('foto-file');

            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Por favor, selecciona al menos una foto.");
                return;
            }

            btn.disabled = true;
            btn.style.background = "#aaa";
            estado.style.color = "#333";
            estado.style.background = "#e2e2e2";
            estado.innerText = `Subiendo con nitidez ${fileInput.files.length} imágenes...`;

            let urlsImagenes = [];

            try {
                // CORRECCIÓN CLAVE: El bucle procesa los archivos uno por uno de forma limpia [INDEX]
                for (let i = 0; i < fileInput.files.length; i++) {
                    if (i >= 5) break; 
                    
                    const formData = new FormData();
                    formData.append('image', fileInput.files[i]); // <-- Aquí se corrigió el envío individual

                    const response = await fetch('https://imgbb.com', {
                        method: 'POST',
                        body: formData
                    });
                    const resData = await response.json();
                    if (resData.success) {
                        urlsImagenes.push(resData.data.url);
                    }
                }

                if (urlsImagenes.length > 0) {
                    estado.innerText = "Guardando en la base de datos de Google...";

                    await addDoc(collection(db, "productos"), {
                        nombre: document.getElementById('nombre').value,
                        precio: parseFloat(document.getElementById('precio').value),
                        descripcion: document.getElementById('descripcion').value,
                        especificaciones: document.getElementById('especificaciones').value,
                        categoria: document.getElementById('categoria').value,
                        imagenes: urlsImagenes,
                        fecha: new Date().getTime()
                    });

                    estado.style.color = "green";
                    estado.style.background = "#d4edda";
                    estado.innerText = "¡Misión cumplida! Artículo publicado con éxito en serbys.com";
                    document.getElementById('form-producto').reset();
                } else {
                    estado.style.color = "red";
                    estado.style.background = "#f8d7da";
                    estado.innerText = "Error al procesar las imágenes.";
                }

            } catch (error) {
                console.error(error);
                estado.style.color = "red";
                estado.style.background = "#f8d7da";
                estado.innerText = "Hubo un problema de conexión con el servidor.";
            } finally {
                btn.disabled = false;
                btn.style.background = "#0044cc";
            }
        });
    </script>
</body>
</html>
