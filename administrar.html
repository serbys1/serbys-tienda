<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Serbys - Automatizado</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    
    <!-- Bloque de seguridad con contraseña -->
    <script>
        (function() {
            const claveCorrecta = "Kellyusa2026"; // <-- CAMBIA ESTO por tu contraseña para entrar de PC o celular
            const sesionActiva = sessionStorage.getItem("admin_autenticado");
            if (sesionActiva !== "true") {
                const intentoClave = prompt("Acceso Restringido. Introduce la contraseña de administrador:");
                if (intentoClave === claveCorrecta) {
                    sessionStorage.setItem("admin_autenticado", "true");
                } else {
                    alert("Contraseña incorrecta.");
                    window.location.href = "index.html";
                }
            }
        })();
    </script>
</head>
<body>

    <div class="container-admin" style="padding: 20px; max-width: 500px; margin: auto;">
        <h2>Subir Producto Real - SERBYS</h2>
        <hr>
        <form id="form-producto" style="display: flex; flex-direction: column; gap: 15px;">
            <label>Nombre del Producto:</label>
            <input type="text" id="nombre" required placeholder="Ej: Parlante Samsung">

            <label>Precio (Dólares):</label>
            <input type="number" step="0.01" id="precio" required placeholder="Ej: 25.00">

            <label>Descripción:</label>
            <textarea id="descripcion" required placeholder="Detalles del artículo..."></textarea>

            <label>Categoría:</label>
            <select id="categoria" required>
                <option value="audio">AUDIO</option>
                <option value="ropa">ROPA</option>
                <option value="muebles">MUEBLES</option>
                <option value="herram">HERRAMIENTAS</option>
            </select>

            <label>Foto del Producto (Nítida):</label>
            <input type="file" id="foto-file" accept="image/*" required>

            <button type="submit" id="btn-guardar" style="background: #007bff; color: white; padding: 10px; border: none; cursor: pointer;">
                🚀 PUBLICAR EN LA WEB
            </button>
        </form>
        <p id="mensaje-estado" style="margin-top: 15px; font-weight: bold; color: green;"></p>
    </div>

    <!-- CARGA DE CONEXIÓN A GOOGLE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc } from "https://gstatic.com";

        // TUS CREDENCIALES REALES DE LA FOTO YA COLOCADAS AQUÍ
        const firebaseConfig = {
            apiKey: "AIzaSyCK3ydBkB_Y3fctSsGLizEQtlYBUaUo8U",
            authDomain: "://firebaseapp.com",
            projectId: "serbys-tienda",
            storageBucket: "serbys-tienda.firebasestorage.app",
            messagingSenderId: "987419818662",
            appId: "1:987419818662:web:2eb44b006d75fe9e5b5267",
            measurementId: "G-PG8BB8DLJR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('form-producto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-guardar');
            const estado = document.getElementById('mensaje-estado');
            
            btn.disabled = true;
            estado.innerText = "Subiendo imagen de forma nítida a internet...";

            const fileInput = document.getElementById('foto-file');
            const file = fileInput.files[0];

            if(!file) return;

            const formData = new FormData();
            formData.append('image', file);
            
            try {
                // Subida gratuita automática a ImgBB
                const response = await fetch('https://imgbb.com', {
                    method: 'POST',
                    body: formData
                });
                const resData = await response.json();
                
                if(resData.success) {
                    const urlImagenNítida = resData.data.url;
                    estado.innerText = "Guardando datos en la base de datos de Google...";

                    // Guardamos la información limpia en tu Cloud Firestore
                    await addDoc(collection(db, "productos"), {
                        nombre: document.getElementById('nombre').value,
                        precio: parseFloat(document.getElementById('precio').value),
                        descripcion: document.getElementById('descripcion').value,
                        categoria: document.getElementById('categoria').value,
                        imagen: urlImagenNítida,
                        fecha: new Date().getTime()
                    });

                    estado.innerText = "¡Misión cumplida! Producto publicado con éxito en serbys.com";
                    document.getElementById('form-producto').reset();
                } else {
                    estado.innerText = "Error al procesar la nitidez de la imagen.";
                }
            } catch (error) {
                console.error(error);
                estado.innerText = "Hubo un problema de conexión con el servidor.";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
